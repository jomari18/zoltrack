<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ZolTrack</title>
    <link rel="icon" href="/favicon.ico?v=zoltrack-v9-final" sizes="any">
    <link rel="icon" type="image/png" href="/assets/favicon-64.png?v=zoltrack-v9-final" sizes="64x64">
    <link rel="icon" type="image/svg+xml" href="/assets/zoltrack-logo.svg?v=zoltrack-v9-final">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="login-page" class="auth-container" >
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">
                    <img class="brand-logo-img" src="assets/zoltrack-logo.svg" alt="ZolTrack Logo">
                    <h1>ZolTrack</h1>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Email</label>
                    <input type="text" class="form-control" id="login-username" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div style="position: relative;">
                        <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
                        <i id="togglePassword" class="far fa-eye" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-block">Sign In</button>
                <div class="auth-switch">
                    Don't have an account? <a href="#" id="go-to-register">Create Account</a>
                </div>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/email-confirmation.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
