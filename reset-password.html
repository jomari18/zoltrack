<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ZolTrack</title>
    <link rel="icon" type="image/svg+xml" href="assets/zoltrack-logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/password-recovery.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>
    <script src="js/password-recovery.js" defer></script>
</head>
<body data-password-recovery>
    <main class="auth-container" id="password-recovery">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">
                    <img class="brand-logo-img" src="assets/zoltrack-logo.svg" alt="ZolTrack Logo">
                    <h1>ZolTrack</h1>
                </div>
                <h2>Reset Password</h2>
                <p>Recover your account using a code sent to your email.</p>
            </div>
            <p id="recovery-status" class="recovery-status" role="status" aria-live="polite" aria-atomic="true"></p>
            <form id="recovery-email-form">
                <div class="form-group">
                    <label for="recovery-email">Email</label>
                    <input type="email" class="form-control" id="recovery-email" placeholder="Enter your account email" autocomplete="email" maxlength="254" required autofocus>
                </div>
                <button type="submit" class="btn btn-block">Send Recovery Code</button>
            </form>
            <form id="recovery-code-form" hidden>
                <p class="recovery-help">Enter the recovery code for <strong id="recovery-target"></strong>.</p>
                <div class="form-group">
                    <label for="recovery-code">Recovery code</label>
                    <input type="text" class="form-control" id="recovery-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required>
                </div>
                <button type="submit" class="btn btn-block">Verify Code</button>
                <button type="button" class="recovery-link" id="recovery-resend">Resend code</button>
            </form>
            <form id="recovery-password-form" hidden>
                <div class="form-group">
                    <label for="recovery-password">New password</label>
                    <input type="password" class="form-control" id="recovery-password" autocomplete="new-password" minlength="8" aria-describedby="recovery-password-help" required>
                    <p class="recovery-help" id="recovery-password-help">Use at least 8 characters.</p>
                </div>
                <div class="form-group">
                    <label for="recovery-confirmation">Confirm new password</label>
                    <input type="password" class="form-control" id="recovery-confirmation" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-block" id="recovery-update">Save New Password</button>
            </form>
            <button type="button" class="recovery-link" id="recovery-change-email" hidden>Use another email</button>
            <div class="auth-switch"><a href="login.html" id="recovery-back">Back to Sign In</a></div>
        </div>
    </main>
</body>
</html>
